# Interest taxonomy, version 1. Three levels: category > interest > specific.
# Full ID = dotted slugs, e.g. outdoors.climbing.bouldering (pattern ^[a-z0-9_]+(\.[a-z0-9_]+){0,2}$).
# IDs are permanent: never rename, re-parent, delete or reuse one. Labels may be polished.
# Additions go through a cg/contracts/ PR (additive, bump version). The design target is ~400 leaves;
# v1 ships ~180, enough for the demo pools.
# sensitive: true applies to the node and every descendant. Sensitive interests start hidden,
# and are only ever shown as shared when both users opted that category in (see AGENT_RULES P4).
# Drop cards show level 2 labels (coarse). Level 3 appears only after a mutual connect.
version: 1
