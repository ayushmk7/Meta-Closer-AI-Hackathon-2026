# Every question asked of Laya, in one place, so the backend and the simulation produce identical
# probabilities for identical inputs. Both services render `state` with the exact templates below.
#
# Laya serves the Jev-compatible POST /v1/systemone at LAYA_URL:
#   { "model": LAYA_MODEL, "state": "<rendered state>", "questions": { "<key>": { "type": ..., "instructions": ..., "criteria": ... } } }
# and returns an `answers` object keyed by question key. Verify the exact answer fields against the
# installed laya-serve docs; wrap them in one adapter (`LayaClient`) per service that returns:
#   noul  -> p: float in [0, 1]   (probability the statement is true)
#   score -> expected value in [0, 1] over `criteria` (index / (len - 1), weighted by probability)
#
# Fake mode (LAYA_FAKE=1 in the backend, --fake-laya in the sim) must agree exactly:
#   p = int(sha256(f"{questionsVersion}|{questionKey}|{state}").hexdigest()[:8], 16) / 0xFFFFFFFF
#   score answers use the same p as the expected value.
#
# Only `noul` and `score` are used. Never `choice`: Laya is weak on many-option questions.
# Decisive rule (params.laya.decisiveThreshold, 0.85): a noul answer is decided by Laya when
# p >= 0.85 or p <= 0.15. Otherwise the caller escalates to Muse with the same state and question.
# Any change to a template or instruction bumps questionsVersion; cached tables with an older
# questionsVersion must be recomputed.
#
# v2 (contracts v2, plans-first): removed `connect` and `opener_ok` and the card_summary fragment;
# `accept_activity` became `join_activity`; added `sensitive_place` and `plan_ok`. The connect table is gone;
# the activity table now carries p_join instead of p_accept.
questionsVersion: 2

# ---------- Shared state fragments ----------
# A fragment renders only public fields that the backend also has (never sim_private data).
# Lists are sorted as stated so both services render byte-identical text.
fragments:
  user_summary: |-
    Person {alias}.
    Neighborhood: {neighborhood}. Age band: {ageBand}.
    Prefers groups of {groupMin} to {groupMax}. Free: {availability}.
    Interests (strongest first): {interests}.
    Recent activity: {activity}.
  # {alias}: "A" or "B" (never the real name)
  # {availability}: slots sorted mon..sun then morning, afternoon, evening, joined as "sat morning, sun afternoon"
  # {interests}: up to 12 shown interests, sorted by weight desc then id asc, rendered "Label (0.82)", comma-joined.
  #              Hidden and sensitive interests are excluded.
  # {activity}: up to 5 most recent activity items, newest first, each "kind: text" with text truncated to 120 chars
  #             (cut at 117 + "..."), joined with " | ". Text = text, else photoCaption, groupName, eventName, pageName, listingTitle.
  # Formatting: weights with 2 decimals ("0.70"); any empty list renders "none"; ageBand verbatim ("22_25").
  # Fragments in a state are joined with a single newline. contracts/laya_golden.json holds reference renders;
  # both services must reproduce them byte for byte in a test.
  activity_type: |-
    Activity type: {activityType}.

# ---------- Questions ----------
questions:
  sensitive_interest:
    type: noul
    usedBy: [backend]
    state: |-
      Interest: {label} ({path}).
      Evidence: {evidence}
    instructions: >-
      Does this interest reveal or strongly imply the person's religion, health condition,
      sexual orientation or gender identity, political views, or ethnicity?
    notes: Taxonomy nodes marked sensitive are always sensitive; this question covers free-text evidence and edge cases.

  sensitive_place:
    type: noul
    usedBy: [backend]
    state: |-
      Place: {placeName}. Kind: {placeKind}.
      Pattern: {pattern}
    instructions: >-
      Does regularly visiting this place reveal or strongly imply the person's religion, health condition,
      sexual orientation or gender identity, political views, or ethnicity?
    notes: >-
      Runs on every place signal (frequent_place, saved_place, post with a place). {placeKind} is the venue kind
      or "unknown"; {pattern} is the signal label, e.g. "Weekly visits on Sunday mornings". A yes hides the signal
      and any interest it produced (P4).

  interest_strength:
    type: score
    usedBy: [backend]
    state: |-
      Interest: {label} ({path}).
      Evidence: {evidence}
    instructions: How central is this interest to the person, based only on the evidence?
    criteria: [passing mention, occasional, regular hobby, core part of their life]

  join_activity:
    type: noul
    usedBy: [backend, sim]
    state: |-
      {user_summary:A}
      {activity_type}
    instructions: >-
      Would person A tap "I'm in" on a plan to do this activity with a small group of strangers who share
      some of their interests?
    table: activity

  show_up:
    type: noul
    usedBy: [backend, sim]
    state: |-
      {user_summary:A}
      {activity_type}
    instructions: If person A joined a plan of this activity type and their group formed, would they actually show up?
    table: activity

  meet_again:
    type: noul
    usedBy: [backend, sim]
    state: |-
      {user_summary:A}
      {user_summary:B}
    instructions: After one meetup, would both A and B want to meet again?
    table: meet_again

  plan_ok:
    type: noul
    usedBy: [backend]
    state: |-
      Plan proposed by a user on a friend-finding app: "{text}"
    instructions: >-
      Is this a safe, legal and friendly plan for a small group of strangers to do in a public place, with no
      sexual content, harassment, drugs, or requests for money or contact details?
    notes: Also used on Muse bar requests that would create a plan. A decisive no returns 422 screened.

  message_flag:
    type: noul
    usedBy: [backend]
    state: |-
      Chat message between new acquaintances: "{text}"
    instructions: Does this message contain a threat, harassment, or sexual content?

  report_severe:
    type: noul
    usedBy: [backend]
    state: |-
      Report reason: {reason}. Details: "{text}"
    instructions: Does this report describe a threat to safety or ongoing harassment?

# ---------- Activity types used by join_activity / show_up ----------
# Plans, venues and meetups carry one of these. Keep the list stable; append only.
activityTypes:
  - coffee
  - walk
  - hike
  - climbing_session
  - run
  - pickup_sport
  - board_game_night
  - video_game_session
  - trivia_night
  - concert
  - museum_visit
  - film_screening
  - cooking_together
  - food_crawl
  - brunch
  - craft_session
  - ceramics_studio
  - photo_walk
  - book_club
  - language_exchange
  - volunteering
  - farmers_market
  - yoga_class
  - beach_day
  - picnic
  - karaoke
  - dance_class
  - hackathon_or_cowork
  - bike_ride
  - comedy_show
  - lunch

# ---------- Table files written by the simulation, read by the backend ----------
# Location: data/laya_tables/<poolId>/ ; Parquet ; one manifest.json alongside.
tables:
  activity:
    file: activity.parquet
    columns: { user_id: string, activity_type: string, p_join: float64, p_show: float64 }
    note: p_join from join_activity, p_show from show_up
    key: [user_id, activity_type]
  meet_again:
    file: meet_again.parquet
    columns: { user_a: string, user_b: string, p_meet_again: float64 }
    key: [user_a, user_b]
    note: user_a < user_b lexicographically; pairs = each user's top params.sim.candidatesPerUser candidates
  manifest:
    file: manifest.json
    fields: { poolId: string, questionsVersion: int, layaModel: string, createdAt: datetime, rows: "object table->int", exportGeneratedAt: datetime }
