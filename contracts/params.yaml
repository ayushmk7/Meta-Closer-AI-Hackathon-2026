# Every tunable number in Common Ground. One source of truth.
# - The backend loads this file at startup and serves the client subset through GET /v1/config.
# - The simulation reads the same file so simulated policies match the live product.
# - The app never hardcodes these values; it reads /v1/config.
# Values are STARTING values. To change one, the sim agent opens a cg/contracts/ PR with the evidence
# (run ID and metric deltas). Agents may override values locally with env vars for experiments only.
version: 2

feed:
  size: 8                     # plan cards in For you (config.limits.feedMax)
  refreshHours: 24            # full rebuild; live updates in between via feed.updated
  maxPerActivityType: 2       # carousel diversity
  maxPerScene: 2              # at most N plans aimed mainly at the same Leiden scene
  promptChips: 4
  demoPinFeatured: true       # in DEMO_MODE, demo.json featuredPlanIds lead Maya's first feed, in order

plans:
  horizonDays: 7              # plans start within the next N days
  minLeadHours: 12            # never propose a plan starting sooner than this
  formLeadHours: 24           # formsAt = startsAt - formLeadHours
  demoFormAtMin: true         # in DEMO_MODE, a plan forms as soon as size.min people joined
  defaultSize: { min: 3, max: 6 }
  openJoinsMax: 5             # interested joins at once (config.limits.openJoinsMax)
  exposureCapPerDay: 40       # a plan appears in at most N carousels per day, so demand spreads
  fillLikelihoodFloor: 0.15   # rank_plans drops plans less likely than this to fill
  proposalsPerSceneWeek: 6    # propose_plans output per scene per week
  userPlansPerWeek: 3         # createPlan limit per user
  alternativesMax: 3

groups:
  strangerSizeMin: 3          # groups with anyone not yet met (config.limits.groupSizeMin)
  metSizeMin: 2               # invite plans with only met people may be one-to-one
  sizeMax: 8                  # config.limits.groupSizeMax
  objective: max_min_pairwise # maximize the lowest pairwise score in each group
  minSharedWithOthers: 1      # groups of 3+: every member shares >= 1 interest with >= minOthers others
  minOthers: 2
  seatPriority: [isolated, earliest_join]

matching:
  parentWeightFactor: 0.5     # parent node weight = factor x child weight
  idf: true                   # rare shared interests count more
  knnK: 20
  minCosine: 0.15
  ageBands: ["18_21", "22_25", "26_29"]
  isolationBoost: 0.5         # multiplicative boost (ranking and seat priority) for users with zero met connections
  leidenResolution: 1.0
  signalBoost: 0.4            # plans at a venue or activity from a visible signal score x (1 + signalBoost)
  rngSeedDefault: 7

travel:
  detourFactor: 1.3           # straight-line km x factor = route km
  speedsKmh: { walk: 4.8, bike: 15, transit: 16, drive: 28 }
  overheadMin: { walk: 0, bike: 3, transit: 8, drive: 6 }   # waiting, parking
  defaultMaxMinutes: 35
  leaveByBufferMin: 10        # leaveBy = startsAt - minutes - buffer

calendar:
  horizonDays: 14             # config.limits.calendarHorizonDays
  syncMinIntervalS: 300       # config.limits.calendarSyncMinIntervalS
  minFreeBufferMin: 30        # a plan "fits" only with this much free time either side

muse:
  askMaxChars: 500            # config.limits.museAskMaxChars
  askPerHour: 30
  liveTimeoutS: 8             # Muse bar, chat, agent step decisions
  batchTimeoutS: 60
  spendWithoutAskingCentsDefault: 0
  autoRescheduleDefault: true
  autoBackfillDefault: true
  calendarHoldsDefault: true
  leaveByRemindersDefault: true
  rescheduleWindowMin: 120    # autonomous moves stay on the same day within +/- this many minutes
  approvalExpiresHours: 12    # payment and change approvals; never later than formsAt
  reminderBeforeMin: 120      # day-of reminder message in the thread

nudges:
  maxPerWeek: 3
  minSignalStrength: 0.6
  frequentPlaceVisits30d: 3   # a place visited at least this often in 30 days is "frequent"
  expiresHours: 48
  quietHours: { start: "21:00", end: "08:00" }   # local time; nudges created then wait until morning

privacy:
  sharedCoarseMax: 3          # interests in Crowd.sharedWithYou, level 2 only
  sharedFullMax: 8            # interests shown after a group forms, level 3 allowed
  crowdMinCount: 2            # Crowd.sharedWithYou is empty until at least N people joined
  cityMinPool: 150            # below this, widen radius, then suggest an Event or Group pool

messages:
  maxChars: 2000

meetups:
  statusWindowBeforeMin: 60   # "on my way" allowed from this long before start until the end

laya:
  questionsVersion: 2
  decisiveThreshold: 0.85     # noul answers with p >= t or p <= 1 - t are decided by Laya; others go to Muse

checkin:
  geofenceM: 150
  opensBeforeMin: 15
  closesAfterMin: 60
  meetupCountsWhen: mutual_confirm_and_checkin   # >= 2 attendees confirm each other and checked in

trust:
  floor: 0.3                  # below: no feed, no joins
  newAccountGroupOnly: true   # strangers-only groups of strangerSizeMin+ until the first counted meetup (always true for strangers in v2)

unlocks:
  - { unlockId: create_plans, afterConfirmedMeetups: 1, label: "Create your own plans" }
  - { unlockId: bigger_groups, afterConfirmedMeetups: 3, label: "Groups up to 8 and 2 more open plans" }
  - { unlockId: regular, afterConfirmedMeetups: 5, requiresNoReports: true, label: "Regular badge" }

client:
  pollIntervalS: 5
  feedRefreshS: 60

features:                     # served as config.features
  eventMode: true
  connectors: true
  nudges: true
  userPlans: true
  payments: true
  autonomySettings: false     # Muse permissions UI; fields exist regardless
  plusOne: false
  checkin: true
  realtime: true

sim:
  personasCity: 300
  personasEvent: 80
  venuesCity: 80
  venuesEvent: 20
  lowOutgoingShare: 0.33
  sensitiveSignalShare: 0.1   # share of personas with one sensitive place in their connector data
  weeks: 8
  seeds: 50
  sweepMultipliers: [0.5, 0.75, 1.0, 1.25, 1.5]   # applied to flake rate and join rate
  friendshipMeetups: 2        # friendship = N meetups where both wanted to meet again
  candidatesPerUser: 20       # top-K pairs precomputed for meet_again

demo:
  syntheticDelayS: [2, 5]     # synthetic counterpart reaction delay range
  stepDelayS: [1, 2]          # pause between visible Muse steps so the timeline reads on stage
  forcedYesDefault: true      # synthetic counterparts join, approve, show up
  relaxCheckinDefault: true
  counterpartDefault: synthetic
  simulatedPayments: true     # config.demo.simulatedPayments
