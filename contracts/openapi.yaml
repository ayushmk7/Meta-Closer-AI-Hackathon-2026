                toMuse: { type: boolean, default: false, description: "Also true on the server when the text starts with 'Muse'." }
      responses:
        "200":
          description: The stored message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        default: { $ref: "#/components/responses/Error" }

  /v1/threads/{threadId}/read:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    post:
      tags: [chat]
      operationId: markThreadRead
      summary: Mark every message in the thread as read.
      responses:
        "204": { description: Marked read }
        default: { $ref: "#/components/responses/Error" }

  /v1/reports:
    post:
      tags: [safety]
      operationId: report
      summary: Report a person. Severe reports pause their account pending review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "200":
          description: Report received
          content:
            application/json:
              schema:
                type: object
                required: [reportId]
                properties:
                  reportId: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/blocks:
    post:
      tags: [safety]
      operationId: block
      summary: Block a person. We never put you in a group together again; they disappear from my threads and people. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "204": { description: Blocked }
        default: { $ref: "#/components/responses/Error" }

  /v1/ws:
    get:
      tags: [system]
      operationId: realtime
      summary: WebSocket upgrade for realtime hints. See CONTRACTS.md "Realtime".
      description: |
        Connect with `ws://<host>/v1/ws?user=<userId>` (query parameter, because not every client can set headers).
        The server sends `RealtimeEvent` JSON frames. The client sends nothing except optional `{"type":"ping"}`.
        Events are hints. After any event, or on reconnect, the client refetches the affected REST resource.
        A client that never connects must still work through polling.
      security: []
      parameters:
        - name: user
          in: query
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching protocols }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    demoUser:
      type: apiKey
      in: header
      name: X-CG-User
      description: Demo identity, e.g. `u_maya`. Only accepted when the backend runs with DEMO_MODE=1.

  parameters:
    InterestId:
      name: interestId
      in: path
      required: true
      description: Taxonomy ID, e.g. `outdoors.climbing.bouldering`.
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      description: Connector provider ID from `contracts/connectors.yaml`, e.g. `google_maps`.
      schema: { type: string }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string }
    MeetupId:
      name: meetupId
      in: path
      required: true
      schema: { type: string }
    ShareId:
      name: shareId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "That plan is no longer available.", retryable: false } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: |
                Open enum. Known values: unauthenticated, not_found, validation_failed, screened, not_allowed,
                not_opted_in, rate_limited, conflict, muse_unavailable, laya_unavailable, unavailable, internal.
                Clients map unknown codes by HTTP status.
            message: { type: string, description: "Safe to show to the user." }
            retryable: { type: boolean }
            details: { type: object, additionalProperties: true }

    Health:
      type: object
      required: [status, apiVersion]
      properties:
        status: { type: string, enum: [ok, degraded] }
        muse: { type: string, enum: [ok, fake, down] }
        laya: { type: string, enum: [ok, fake, down] }
        demoMode: { type: boolean }
        apiVersion: { type: string }

    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Mode:
      type: string
      description: Open enum. Clients hide modes they do not recognise.
      enum: [city, event, campus, group, arriving, cohort]

    ModeInfo:
      type: object
      required: [mode, label, poolId, available]
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        label: { type: string }
        poolId: { type: string }
        available: { type: boolean, description: "false = shown as 'coming soon', not selectable." }
        description: { type: string }
        center: { $ref: "#/components/schemas/LatLng" }
        radiusKm: { type: number }

    Config:
      type: object
      required: [apiVersion, features, limits, modes, demo]
      properties:
        apiVersion: { type: string }
        features:
          type: object
          description: Clients hide any surface whose flag is false or missing.
          additionalProperties: { type: boolean }
          properties:
            eventMode: { type: boolean }
            connectors: { type: boolean }
            nudges: { type: boolean }
            userPlans: { type: boolean }
            payments: { type: boolean }
            autonomySettings: { type: boolean, description: "Show the Muse permissions settings. The fields exist in Me regardless." }
            plusOne: { type: boolean }
            checkin: { type: boolean }
            realtime: { type: boolean }
            sharing: { type: boolean, description: "Share buttons and the public plan page (getPublicPlan)." }
        limits:
          type: object
          additionalProperties: { type: number }
          required: [feedMax, sharedCoarseMax, sharedFullMax, messageMaxChars, museAskMaxChars, groupSizeMin, groupSizeMax, openJoinsMax, pollIntervalS, feedRefreshS, calendarSyncMinIntervalS, calendarHorizonDays]
          properties:
            feedMax: { type: integer }
            sharedCoarseMax: { type: integer }
            sharedFullMax: { type: integer }
            messageMaxChars: { type: integer }
            museAskMaxChars: { type: integer }
            groupSizeMin: { type: integer }
            groupSizeMax: { type: integer }
            openJoinsMax: { type: integer }
            pollIntervalS: { type: integer }
            feedRefreshS: { type: integer }
            calendarSyncMinIntervalS: { type: integer }
            calendarHorizonDays: { type: integer }
            meetupStatusBeforeMin: { type: integer, description: "Minutes before start when 'on my way' becomes available." }
        modes:
          type: array
          items: { $ref: "#/components/schemas/ModeInfo" }
        demo:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            counterpart: { type: string, enum: [live, synthetic] }
            fakeLocation:
              description: When present, the app uses this instead of GPS at check-in.
              oneOf:
                - { $ref: "#/components/schemas/LatLng" }
                - { type: "null" }
            relaxCheckin: { type: boolean, description: "When true the server accepts check-ins outside the geofence and window." }
            simulatedPayments: { type: boolean, description: "When true, approval sheets say no real money moves." }
            stepDelayS:
              description: "params.demo.stepDelayS: [min, max] seconds between visible Muse steps. Optional; clients default to 2."
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2

    InterestRef:
      type: object
      required: [id, label, path, level]
      description: A taxonomy node. The server picks the level (2 = coarse, 3 = full depth).
      properties:
        id: { type: string, pattern: "^[a-z0-9_]+(\\.[a-z0-9_]+){0,2}$" }
        label: { type: string }
        path: { type: array, items: { type: string }, minItems: 1, maxItems: 3 }
        level: { type: integer, minimum: 1, maximum: 3 }

    Visibility:
      type: string
      enum: [shown, hidden]

    MyInterest:
      type: object
      required: [interest, weight, visibility, sensitive, source]
      properties:
        interest: { $ref: "#/components/schemas/InterestRef" }
        weight: { type: number, minimum: 0, maximum: 1 }
        visibility: { $ref: "#/components/schemas/Visibility" }
        sensitive: { type: boolean, description: "Flagged sensitive. Starts hidden; only the owner sees this flag." }
        source:
          type: string
          description: Open enum.
          enum: [activity, connector, muse_bar, manual]
        evidence: { type: string, description: "Short paraphrase of why Muse added it. Only the owner sees it." }

    AvailabilitySlot:
      type: object
      required: [day, part]
      description: Coarse fallback availability, used only when no calendar is connected.
      properties:
        day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        part: { type: string, enum: [morning, afternoon, evening] }

    GroupSize:
      type: object
      required: [min, max]
      properties:
        min: { type: integer, minimum: 2 }
        max: { type: integer, minimum: 2 }

    TravelMode:
      type: string
      description: Open enum.
      enum: [transit, walk, bike, drive]

    TravelPrefs:
      type: object
      required: [maxMinutes, modes]
      properties:
        maxMinutes: { type: integer, minimum: 5 }
        modes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/TravelMode" } }

    MuseSettings:
      type: object
      description: What Muse may do without asking. The settings UI is behind features.autonomySettings; the defaults come from params.muse.
      required: [spendWithoutAskingCents, autoReschedule, autoBackfill, calendarHolds, leaveByReminders]
      properties:
        spendWithoutAskingCents: { type: integer, minimum: 0, description: "0 = always ask before paying." }
        autoReschedule: { type: boolean, description: "Move a plan inside the approved window when everyone stays free and the cost does not rise." }
        autoBackfill: { type: boolean }
        calendarHolds: { type: boolean }
        leaveByReminders: { type: boolean }

    Capabilities:
      type: object
      description: What trust and unlocks allow. The trust score itself is never exposed.
      required: [canCreatePlans, maxGroupSize, groupOnly, openJoinsMax]
      properties:
        canCreatePlans: { type: boolean }
        maxGroupSize: { type: integer }
        groupOnly: { type: boolean, description: "true = only groups of 3 or more, never one-to-one." }
        openJoinsMax: { type: integer }

    Rewards:
      type: object
      description: "Private progress, shown only to the user (DESIGN Rewards). Optional on Me; absent means none yet."
      required: [confirmedMeetups, streakWeeks]
      properties:
        confirmedMeetups: { type: integer, minimum: 0, description: "Meetups that counted (PRD-2 trust rule)." }
        streakWeeks: { type: integer, minimum: 0, description: "Consecutive weeks (America/Los_Angeles, Mon-Sun) with at least one counted meetup, ending this or last week." }
        nextUnlock:
          oneOf:
            - type: object
              required: [unlockId, label, remaining]
              properties:
                unlockId: { type: string }
                label: { type: string }
                remaining: { type: integer, minimum: 1, description: "Counted meetups still needed." }
            - { type: "null" }

    Unlock:
      type: object
      required: [unlockId, label, earnedAt]
      properties:
        unlockId: { type: string }
        label: { type: string }
        description: { type: string }
        earnedAt: { type: string, format: date-time }

    Me:
      type: object
      required: [userId, displayName, profileVisibility, optedIn, setupComplete, interests, groupSize, availability, travel, museSettings, capabilities, unlocks]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"] }
        profileVisibility: { $ref: "#/components/schemas/ProfileVisibility" }
        optedIn: { type: boolean }
        setupComplete: { type: boolean }
        mode: { oneOf: [{ $ref: "#/components/schemas/Mode" }, { type: "null" }] }
        poolId: { type: [string, "null"] }
        neighborhood: { type: [string, "null"] }
        groupSize: { $ref: "#/components/schemas/GroupSize" }
        availability: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
        travel: { $ref: "#/components/schemas/TravelPrefs" }
        interests: { type: array, items: { $ref: "#/components/schemas/MyInterest" } }
        museSettings: { $ref: "#/components/schemas/MuseSettings" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        unlocks: { type: array, items: { $ref: "#/components/schemas/Unlock" } }
        rewards: { $ref: "#/components/schemas/Rewards" }

    MeUpdate:
      type: object
      properties:
        profileVisibility: { $ref: "#/components/schemas/ProfileVisibility" }
        neighborhood: { type: string }
        groupSize: { $ref: "#/components/schemas/GroupSize" }
        availability: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
        travel: { $ref: "#/components/schemas/TravelPrefs" }
        museSettings: { $ref: "#/components/schemas/MuseSettings" }

    ProfileVisibility:
      type: string
      enum: [public, private]

    Setup:
      type: object
      required: [museText, proposedInterests, signals, proposedGroupSize, proposedTravel, suggestedProviders]
      properties:
        museText: { type: string, description: "Muse's one or two lines for the review step." }
        proposedInterests: { type: array, items: { $ref: "#/components/schemas/MyInterest" } }
        signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
        proposedGroupSize: { $ref: "#/components/schemas/GroupSize" }
        proposedTravel: { $ref: "#/components/schemas/TravelPrefs" }
        suggestedProviders: { type: array, items: { type: string } }

    SetupComplete:
      type: object
      required: [acceptedInterestIds, hiddenInterestIds, groupSize, travel, profileVisibility]
      properties:
        acceptedInterestIds: { type: array, items: { type: string } }
        hiddenInterestIds: { type: array, items: { type: string } }
        groupSize: { $ref: "#/components/schemas/GroupSize" }
        travel: { $ref: "#/components/schemas/TravelPrefs" }
        availability: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
        profileVisibility: { $ref: "#/components/schemas/ProfileVisibility" }
        neighborhood: { type: string }

    ConnectorStatus:
      type: string
      description: Open enum.
      enum: [connected, not_connected, coming_soon]

    Connector:
      type: object
      required: [provider, label, reads, status, simulated, signalCount]
      properties:
        provider: { type: string, description: "Open enum from contracts/connectors.yaml." }
        label: { type: string }
        reads: { type: string, description: "Exactly what Muse reads, shown next to the toggle." }
        status: { $ref: "#/components/schemas/ConnectorStatus" }
        simulated: { type: boolean, description: "true = seeded demo data, no real account." }
        connectedAt: { type: [string, "null"], format: date-time }
        lastSyncAt: { type: [string, "null"], format: date-time }
        signalCount: { type: integer }

    Signal:
      type: object
      description: Something Muse noticed. Owner-only; never in another user's response.
      required: [signalId, provider, kind, label, interests, observedAt, visibility, sensitive]
      properties:
        signalId: { type: string }
        provider: { type: string, description: "A connector provider, or `facebook` for Facebook activity." }
        kind:
          type: string
          description: Open enum.
          enum: [frequent_place, saved_place, routine, ticket, artist, post, life_event]
        label: { type: string }
        interests: { type: array, items: { $ref: "#/components/schemas/InterestRef" } }
        venue:
          oneOf:
            - { $ref: "#/components/schemas/Venue" }
            - { type: "null" }
        observedAt: { type: string, format: date-time }
        visibility: { $ref: "#/components/schemas/Visibility" }
        sensitive: { type: boolean }

    Because:
      type: object
      description: Why Muse suggested this to me. Owner-only.
      required: [source, label]
      properties:
        source: { type: string, description: "Connector provider, `facebook` or `muse`." }
        label: { type: string }
        signalId: { type: [string, "null"] }

    BusyBlock:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    CalendarDirective:
      type: object
      description: |
        The calendar state the backend wants on this device for one join or meetup. The app reconciles its own
        "Common Ground" calendar to it (none = delete) and reports back in the next syncCalendar. Never contains other people's names.
      required: [key, desired, title, startsAt, endsAt]
      properties:
        key: { type: string, description: "Stable per join or meetup (its ID)." }
        desired: { type: string, enum: [none, hold, event] }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, "null"] }
        notes: { type: [string, "null"] }

    CalendarSync:
      type: object
      required: [source, horizonStart, horizonEnd, busy, applied]
      properties:
        source: { type: string, enum: [device_calendar] }
        horizonStart: { type: string, format: date-time }
        horizonEnd: { type: string, format: date-time }
        busy: { type: array, items: { $ref: "#/components/schemas/BusyBlock" }, description: "Start and end only. Events in the app's own Common Ground calendar are excluded." }
        applied:
          type: array
          items:
            type: object
            required: [key, desired, ok]
            properties:
              key: { type: string }
              desired: { type: string, enum: [none, hold, event] }
              ok: { type: boolean }

    CalendarSyncResult:
      type: object
      required: [acceptedBusy, directives]
      properties:
        acceptedBusy: { type: integer }
        directives: { type: array, items: { $ref: "#/components/schemas/CalendarDirective" } }

    MuseReply:
      type: object
      required: [conversationId, reply, plans, prompts]
      properties:
        conversationId: { type: string }
        reply:
          type: object
          required: [messageId, text, createdAt]
          properties:
            messageId: { type: string }
            text: { type: string }
            createdAt: { type: string, format: date-time }
        plans: { type: array, items: { $ref: "#/components/schemas/PlanCard" } }
        createdPlanId: { type: [string, "null"], description: "Set when Muse created a new plan from the request; it is also in `plans`." }
        prompts: { type: array, items: { type: string }, description: "Follow-up chips." }

    Venue:
      type: object
      required: [venueId, name, location, kind]
      properties:
        venueId: { type: string }
        name: { type: string }
        neighborhood: { type: string }
        address: { type: string }
        location: { $ref: "#/components/schemas/LatLng" }
        kind: { type: string, description: "Open enum, e.g. park, cafe, game_cafe, climbing_gym, studio, museum, bar, library." }
        photoUrl: { type: [string, "null"] }

    Cost:
      type: object
      required: [kind, perPersonCents, currency, label]
      properties:
        kind:
          type: string
          description: Open enum. `prepaid` needs a payment approval; `pay_at_venue` never does.
          enum: [free, pay_at_venue, prepaid]
        perPersonCents: { type: integer, minimum: 0 }
        currency: { type: string }
        label: { type: string }

    Travel:
      type: object
      required: [mode, minutes, label]
      description: Server estimate from my neighborhood centroid; never from an exact location.
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        minutes: { type: integer }
        label: { type: string }

    Directions:
      type: object
      description: Opened only when the user taps. Carries only the venue's public coordinates.
      required: [apple, google]
      properties:
        apple: { type: string }
        google: { type: string }

    PlanCheck:
      type: object
      required: [kind, ok, label]
      properties:
        kind:
          type: string
          description: Open enum.
          enum: [calendar, travel, spots, cost, weather]
        ok: { type: boolean }
        label: { type: string }

    Crowd:
      type: object
      description: Who's in, before a group forms. Counts and coarse interests shared with me only. Never names.
      required: [interestedCount, spotsLeft, sharedWithYou]
      properties:
        interestedCount: { type: integer }
        spotsLeft: { type: integer }
        sharedWithYou:
          type: array
          maxItems: 3
          items:
            type: object
            required: [interest, count]
            properties:
              interest: { $ref: "#/components/schemas/InterestRef" }
              count: { type: integer }

    PlanStatus:
      type: string
      description: Open enum.
      enum: [open, full, closed, cancelled]

    JoinStatus:
      type: string
      description: Open enum.
      enum: [interested, matched, not_filled, withdrawn]

    PlanCard:
      type: object
      required: [planId, title, activityType, venue, startsAt, endsAt, durationMin, cost, size, crowd, checks, reason, because, origin, status]
      properties:
        planId: { type: string }
        title: { type: string }
        activityType: { type: string, description: "From laya_questions.yaml#activityTypes. Open enum." }
        venue: { $ref: "#/components/schemas/Venue" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        durationMin: { type: integer }
        cost: { $ref: "#/components/schemas/Cost" }
        size: { $ref: "#/components/schemas/GroupSize" }
        crowd: { $ref: "#/components/schemas/Crowd" }
        travel:
          oneOf:
            - { $ref: "#/components/schemas/Travel" }
            - { type: "null" }
        checks: { type: array, items: { $ref: "#/components/schemas/PlanCheck" } }
        reason: { type: string, maxLength: 160, description: "Muse's one-line reason." }
        because: { type: array, items: { $ref: "#/components/schemas/Because" } }
        origin:
          type: string
          description: Open enum.
          enum: [muse, nudge, user, invite]
        status: { $ref: "#/components/schemas/PlanStatus" }
        myJoin:
          oneOf:
            - type: object
              required: [joinId, status]
              properties:
                joinId: { type: string }
                status: { $ref: "#/components/schemas/JoinStatus" }
            - { type: "null" }

    PlanDetail:
      allOf:
        - { $ref: "#/components/schemas/PlanCard" }
        - type: object
          required: [description, museWillHandle, safety, formsAt, alternatives, directions]
          properties:
            description: { type: string }
            museWillHandle: { type: array, items: { type: string }, description: "What Muse does once the group forms." }
            safety: { type: array, items: { type: string } }
            formsAt: { type: string, format: date-time, description: "Fill deadline. Earlier if the plan fills." }
            alternatives:
              type: array
              items:
                type: object
                required: [planId, title, startsAt]
                properties:
                  planId: { type: string }
                  title: { type: string }
                  startsAt: { type: string, format: date-time }
            directions: { $ref: "#/components/schemas/Directions" }

    Feed:
      type: object
      required: [generatedAt, nextRefreshAt, prompts, plans]
      properties:
        generatedAt: { type: string, format: date-time }
        nextRefreshAt: { type: string, format: date-time }
        museStatus: { type: [string, "null"], description: "Muse's live status line, e.g. 'Muse is setting up 1 plan for you'." }
        prompts: { type: array, items: { type: string } }
        plans: { type: array, items: { $ref: "#/components/schemas/PlanCard" } }

    Join:
      type: object
      required: [joinId, planId, status, progress, formsAt, createdAt, alternatives]
      properties:
        joinId: { type: string }
        planId: { type: string }
        plan: { $ref: "#/components/schemas/PlanCard" }
        status: { $ref: "#/components/schemas/JoinStatus" }
        progress:
          type: object
          required: [joined, needed]
          description: "'3 of 4'. `joined` counts everyone in, including me."
          properties:
            joined: { type: integer }
            needed: { type: integer }
        meetupId: { type: [string, "null"], description: "Set once matched." }
        formsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        alternatives: { type: array, items: { type: string }, description: "Plan IDs suggested when not_filled." }
        calendar:
          oneOf:
            - { $ref: "#/components/schemas/CalendarDirective" }
            - { type: "null" }

    NudgeSurface:
      type: string
      description: Open enum.
      enum: [plans, home, events]

    Nudge:
      type: object
      required: [nudgeId, title, text, because, planId, surfaces, createdAt, expiresAt]
      properties:
        nudgeId: { type: string }
        title: { type: string }
        text: { type: string }
        because: { type: array, items: { $ref: "#/components/schemas/Because" } }
        planId: { type: string }
        surfaces: { type: array, items: { $ref: "#/components/schemas/NudgeSurface" } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    PersonCard:
      type: object
      description: |
        How another user appears. People appear only after a group forms. For private profiles the server sends
        first name only and `avatarUrl: null`.
      required: [userId, initials, profileVisibility]
      properties:
        userId: { type: string }
        displayName: { type: [string, "null"] }
        initials: { type: string }
        avatarUrl: { type: [string, "null"] }
        profileVisibility: { $ref: "#/components/schemas/ProfileVisibility" }

    MuseStepStatus:
      type: string
      description: Open enum.
      enum: [queued, running, done, needs_you, failed, skipped]

    MuseStep:
      type: object
      description: One visible thing Muse did or will do for a meetup. Steps are appended, never reordered.
      required: [stepId, kind, status, label, at]
      properties:
        stepId: { type: string }
        kind:
          type: string
          description: Open enum.
          enum: [group_chat, find_time, choose_venue, check_availability, payment, book, calendar, event, reminder, reschedule, backfill, cancel, refund]
        status: { $ref: "#/components/schemas/MuseStepStatus" }
        label: { type: string }
        detail: { type: [string, "null"] }
        approvalId: { type: [string, "null"] }
        at: { type: string, format: date-time }

    Approval:
      type: object
      required: [approvalId, meetupId, kind, status, title, detail, simulated, fallback, expiresAt]
      properties:
        approvalId: { type: string }
        meetupId: { type: string }
        kind:
          type: string
          description: Open enum. `payment` = Muse wants to pay; `change` = a change outside what I approved; `plus_one`.
          enum: [payment, change, plus_one]
        status: { type: string, enum: [pending, approved, declined, expired] }
        title: { type: string }
        detail: { type: string }
        amountCents: { type: [integer, "null"] }
        currency: { type: [string, "null"] }
        payee: { type: [string, "null"] }
        simulated: { type: boolean, description: "true = no real money moves (demo)." }
        fallback: { type: string, description: "What Muse does if I decline or let it expire." }
        expiresAt: { type: string, format: date-time }

    Booking:
      type: object
      required: [status, label, provider]
      properties:
        status:
          type: string
          description: Open enum.
          enum: [not_needed, not_booked, holding, booked, pay_at_venue, failed]
        label: { type: string }
        provider: { type: string }
        confirmationCode: { type: [string, "null"] }

    MeetupCost:
      allOf:
        - { $ref: "#/components/schemas/Cost" }
        - type: object
          required: [myPayment]
          properties:
            myPayment:
              type: string
              description: Open enum.
              enum: [not_needed, pending_approval, paid, pay_at_venue, declined]

    MeetupTravel:
      allOf:
        - { $ref: "#/components/schemas/Travel" }
        - type: object
          required: [leaveBy, directions]
          properties:
            leaveBy: { type: string, format: date-time, description: "The app schedules a local notification at this time when museSettings.leaveByReminders." }
            directions: { $ref: "#/components/schemas/Directions" }

    AttendeeStatus:
      type: string
      enum: [on_my_way, arrived]

    Attendee:
      type: object
      required: [person, isMe, rsvp, checkedIn, sharedInterests]
      properties:
        person: { $ref: "#/components/schemas/PersonCard" }
        isMe: { type: boolean }
        rsvp: { type: string, enum: [going, left] }
        checkedIn: { type: boolean }
        status:
          oneOf:
            - { $ref: "#/components/schemas/AttendeeStatus" }
            - { type: "null" }
        sharedInterests:
          type: array
          description: Full depth, capped by config.limits.sharedFullMax. Empty for me.
          items: { $ref: "#/components/schemas/InterestRef" }
        verified: { type: boolean, description: "Confirmed in person by a QR scan (verifyAttendee). Absent = false." }

    Meetup:
      type: object
      required: [meetupId, planId, threadId, title, activityType, status, venue, startsAt, endsAt, attendees, museSteps, approvals, booking, cost, feedbackDue]
      properties:
        meetupId: { type: string }
        planId: { type: string }
        threadId: { type: string }
        title: { type: string }
        activityType: { type: string }
        status:
          type: string
          description: Open enum.
          enum: [setting_up, confirmed, completed, cancelled]
        venue: { $ref: "#/components/schemas/Venue" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        attendees: { type: array, items: { $ref: "#/components/schemas/Attendee" } }
        museSteps: { type: array, items: { $ref: "#/components/schemas/MuseStep" } }
        approvals: { type: array, description: "My approvals for this meetup, any status.", items: { $ref: "#/components/schemas/Approval" } }
        booking: { $ref: "#/components/schemas/Booking" }
        cost: { $ref: "#/components/schemas/MeetupCost" }
        calendar:
          oneOf:
            - { $ref: "#/components/schemas/CalendarDirective" }
            - { type: "null" }
        travel:
          oneOf:
            - { $ref: "#/components/schemas/MeetupTravel" }
            - { type: "null" }
        checkinWindow:
          oneOf:
            - type: object
              required: [opensAt, closesAt]
              properties:
                opensAt: { type: string, format: date-time }
                closesAt: { type: string, format: date-time }
            - { type: "null" }
        feedbackDue: { type: boolean }
        eventLabel: { type: [string, "null"], description: "Label of the private Facebook Event Muse created, e.g. 'Private event · 3 going'." }
        verifyCode: { type: [string, "null"], description: "My own 6-character code, shown as a QR for others to scan. Owner-only: never another attendee's code." }

    CheckinResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        reason:
          type: string
          description: Open enum.
          enum: [outside_geofence, outside_window, not_attendee]

    Feedback:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [userId, showedUp, meetAgain]
            properties:
              userId: { type: string }
              showedUp: { type: boolean }
              meetAgain: { type: boolean }
        note: { type: string, maxLength: 1000 }
        reportUserIds: { type: array, items: { type: string } }
        rating: { type: integer, minimum: 1, maximum: 5, description: "Overall stars for the meetup." }
        tags:
          type: array
          items:
            type: string
            description: Open enum.
            enum: [great_venue, good_group, too_far, too_long]

    VerifyResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        reason:
          type: string
          description: Open enum.
          enum: [invalid_code, not_attendee, outside_window, self]
        person: { $ref: "#/components/schemas/PersonCard" }

    Share:
      type: object
      description: An anonymous meetup share. It has no person fields; the photo is the venue photo only.
      required: [shareId, activityType, caption, venue, groupSize, happenedOn, photoUrl, likes, likedByMe, mine, promptText]
      properties:
        shareId: { type: string }
        activityType: { type: string }
        caption: { type: string, maxLength: 140 }
        venue:
          type: object
          required: [venueId, name, neighborhood]
          properties:
            venueId: { type: string }
            name: { type: string }
            neighborhood: { type: string }
        groupSize: { type: integer, minimum: 2 }
        happenedOn: { type: string, format: date, description: "Local date (America/Los_Angeles)." }
        photoUrl: { type: [string, "null"], description: "Venue photo only, never a user photo." }
        likes: { type: integer, minimum: 0 }
        likedByMe: { type: boolean }
        mine: { type: boolean }
        promptText: { type: string, description: "Muse bar prompt for 'Plan something like this'." }

    PublicPlan:
      type: object
      description: A plan as a logged-out reader sees it. No person fields, no viewer-specific fields.
      required: [planId, title, description, activityType, venue, photoUrl, startsAt, endsAt, cost, size, status, interestedCount, spotsLeft]
      properties:
        planId: { type: string }
        title: { type: string, maxLength: 80 }
        description: { type: string }
        activityType: { type: string }
        venue:
          type: object
          description: Same shape as Share.venue. No address, no coordinates.
          required: [venueId, name, neighborhood]
          properties:
            venueId: { type: string }
            name: { type: string }
            neighborhood: { type: string }
        photoUrl: { type: [string, "null"], description: "Venue photo only." }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cost: { $ref: "#/components/schemas/Cost" }
        size: { $ref: "#/components/schemas/GroupSize" }
        status: { $ref: "#/components/schemas/PlanStatus" }
        interestedCount: { type: integer, description: "0 until at least privacy.crowdMinCount people are in." }
        spotsLeft: { type: integer }

    Connection:
      type: object
      description: Someone I've been in a formed group with.
      required: [connectionId, person, sharedInterests, status, meetupsTogether, connectedAt, canViewProfile, canPlanAgain]
      properties:
        connectionId: { type: string }
        person: { $ref: "#/components/schemas/PersonCard" }
        sharedInterests:
          type: array
          description: Full depth, capped by config.limits.sharedFullMax.
          items: { $ref: "#/components/schemas/InterestRef" }
        status: { type: string, enum: [new, met], description: "`met` after a meetup that counts (params.checkin.meetupCountsWhen)." }
        meetupsTogether: { type: integer }
        connectedAt: { type: string, format: date-time }
        firstMetAt: { type: [string, "null"], format: date-time }
        canViewProfile: { type: boolean }
        canPlanAgain: { type: boolean, description: "true once `met`: can be invited with createPlan.inviteUserIds." }

    PublicProfile:
      type: object
      required: [person, sharedInterests]
      properties:
        person: { $ref: "#/components/schemas/PersonCard" }
        bio: { type: [string, "null"] }
        neighborhood: { type: [string, "null"] }
        sharedInterests: { type: array, items: { $ref: "#/components/schemas/InterestRef" } }
        meetupsTogether: { type: integer }

    Thread:
      type: object
      required: [threadId, kind, title, participants, unreadCount, updatedAt]
      properties:
        threadId: { type: string }
        kind: { type: string, enum: [group, direct] }
        title: { type: string }
        participants: { type: array, items: { $ref: "#/components/schemas/PersonCard" } }
        lastMessage:
          oneOf:
            - { $ref: "#/components/schemas/Message" }
            - { type: "null" }
        unreadCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        meetupId: { type: [string, "null"] }

    MessageSender:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Open enum. `muse` messages are styled as Muse; `system` as small centered notes.
          enum: [user, muse, system]
        userId: { type: [string, "null"] }

    MessageAttachment:
      type: object
      description: |
        Open union keyed by `kind`. Clients render known kinds and skip unknown ones.
        - starters: conversation starter chips (tapping one fills the composer).
        - meetup: a meetup card for `meetupId`; the client fetches the meetup.
        - muse_steps: a compact progress card for `stepIds` of `meetupId`.
        - approval: an inline approval for `approvalId` (only in the approver's view).
        - plan: a plan card for `planId`.
      required: [kind]
      properties:
        kind: { type: string }
        starters: { type: array, items: { type: string } }
        meetupId: { type: string }
        stepIds: { type: array, items: { type: string } }
        approvalId: { type: string }
        planId: { type: string }

    Message:
      type: object
      required: [messageId, threadId, sender, text, createdAt, attachments]
      properties:
        messageId: { type: string }
        threadId: { type: string }
        sender: { $ref: "#/components/schemas/MessageSender" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        clientId: { type: [string, "null"] }
        toMuse: { type: boolean }
        attachments: { type: array, items: { $ref: "#/components/schemas/MessageAttachment" } }

    ReportRequest:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string }
        reason:
          type: string
          enum: [threat, harassment, no_show_pattern, fake_account, other]
        text: { type: string, maxLength: 2000 }
        threadId: { type: string }
        meetupId: { type: string }

    RealtimeEvent:
      type: object
      description: Envelope for WebSocket frames. Unknown `type` values must be ignored.
      required: [type, eventId, at, data]
      properties:
        type:
          type: string
          description: |
            Open enum. Values and what the client should refetch (CONTRACTS.md §6):
            feed.updated ({}) -> /v1/feed;
            join.updated (Join) -> /v1/joins;
            meetup.updated (Meetup) -> that meetup and /v1/meetups;
            meetup.step ({meetupId, step}) -> merge the step, or refetch that meetup;
            approval.requested (Approval) -> /v1/approvals and that meetup;
            nudge.created (Nudge) -> /v1/nudges;
            message.created (Message) -> append or refetch thread messages;
            thread.updated (Thread) -> /v1/threads;
            connection.created (Connection) -> /v1/connections;
            calendar.changed ({}) -> call syncCalendar;
            signals.updated ({}) -> /v1/signals, /v1/me/setup;
            me.updated ({}) -> /v1/me and /v1/config.
        eventId: { type: string }
        at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
