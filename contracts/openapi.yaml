openapi: 3.1.0
info:
  title: Common Ground public API
  version: "2.0.0"
  summary: The only interface between the iOS app and the backend.
  description: |
    Contract v2 (plans-first, visible Muse agent, connectors). Owned by the human integrator (`contracts/**`).
    Read `contracts/CONTRACTS.md` first. v2 replaces v1 wholesale; the URL prefix stays `/v1`.

    Rules that apply to every operation:
    - JSON field names are camelCase. Timestamps are ISO 8601 UTC strings ending in `Z`.
    - All IDs are opaque strings. Clients never parse them.
    - Every request carries `X-CG-User` (demo identity). There is no other auth in v2.
    - Additive evolution only within v2: new optional fields, new operations, new enum values in open enums.
      Clients ignore unknown fields and render a neutral fallback for unknown enum values.
    - Errors always use the `Error` envelope.
    - Interest granularity (coarse vs full depth) is decided by the server. Clients render `label` as given.
    - Any number a client needs (limits, intervals, sizes) comes from `GET /v1/config`, never a hardcoded constant.
    - Text the user sees (`reason`, `label`, Muse messages, step labels, approval titles) is final copy.
servers:
  - url: http://localhost:8000
    description: Local backend or Prism mock (`make mock-api`)
security:
  - demoUser: []
tags:
  - name: system
  - name: me
  - name: connectors
  - name: muse
  - name: plans
  - name: nudges
  - name: meetups
  - name: approvals
  - name: people
  - name: chat
  - name: safety
  - name: shares
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Liveness and dependency status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, muse: ok, laya: ok, demoMode: true, apiVersion: "2" }

  /v1/config:
    get:
      tags: [system]
      operationId: getConfig
      summary: Feature flags, limits and modes for this user. Clients read every number from here.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
              example:
                apiVersion: "2"
                features: { eventMode: true, connectors: true, nudges: true, userPlans: true, payments: true, autonomySettings: false, plusOne: false, checkin: true, realtime: true, sharing: true }
                limits: { feedMax: 8, sharedCoarseMax: 3, sharedFullMax: 8, messageMaxChars: 2000, museAskMaxChars: 500, groupSizeMin: 3, groupSizeMax: 8, openJoinsMax: 5, pollIntervalS: 5, feedRefreshS: 60, calendarSyncMinIntervalS: 300, calendarHorizonDays: 14, meetupStatusBeforeMin: 60 }
                modes:
                  - { mode: city, label: "San Francisco", poolId: pool_sf_city, available: true, description: "Plans near you in San Francisco", center: { lat: 37.7749, lng: -122.4194 }, radiusKm: 10 }
                  - { mode: event, label: "Closer Together AI Hackathon", poolId: pool_evt_closer_together, available: true, description: "Plans with people at this event, Nov 11 to 13", center: { lat: 37.4848, lng: -122.1484 }, radiusKm: 2 }
                  - { mode: campus, label: "Campus", poolId: pool_campus_placeholder, available: false, description: "Coming soon" }
                demo: { enabled: true, counterpart: synthetic, fakeLocation: { lat: 37.7639, lng: -122.4689 }, relaxCheckin: true, simulatedPayments: true, stepDelayS: [1, 2] }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The current user's own profile, including hidden interests, Muse settings and capabilities.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example:
                userId: u_maya
                displayName: Maya Chen
                avatarUrl: http://localhost:8000/static/avatars/u_maya.jpg
                profileVisibility: public
                optedIn: true
                setupComplete: true
                mode: city
                poolId: pool_sf_city
                neighborhood: Inner Sunset
                groupSize: { min: 3, max: 5 }
                availability: [{ day: sat, part: morning }, { day: sun, part: afternoon }, { day: wed, part: evening }]
                travel: { maxMinutes: 35, modes: [transit, walk] }
                interests:
                  - { interest: { id: outdoors.hiking.coastal_hikes, label: Coastal hikes, path: [Outdoors, Hiking, Coastal hikes], level: 3 }, weight: 0.82, visibility: shown, sensitive: false, source: connector, evidence: "4 visits to Lands End Trail in October (Google Maps)" }
                  - { interest: { id: arts_crafts.ceramics.wheel_throwing, label: Wheel throwing, path: [Arts & crafts, Ceramics, Wheel throwing], level: 3 }, weight: 0.7, visibility: shown, sensitive: false, source: activity, evidence: "Member of SF Clay Collective" }
                  - { interest: { id: games.board_games.strategy_games, label: Strategy board games, path: [Games, Board games, Strategy board games], level: 3 }, weight: 0.55, visibility: shown, sensitive: false, source: activity }
                museSettings: { spendWithoutAskingCents: 0, autoReschedule: true, autoBackfill: true, calendarHolds: true, leaveByReminders: true }
                capabilities: { canCreatePlans: false, maxGroupSize: 6, groupOnly: true, openJoinsMax: 5 }
                unlocks: []
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update profile settings. Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/interests/{interestId}:
    parameters:
      - $ref: "#/components/parameters/InterestId"
    put:
      tags: [me]
      operationId: setInterestVisibility
      summary: Show or hide one of my interests. Hidden interests are never used for overlap, plans or nudges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "200":
          description: Updated interest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyInterest" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      operationId: removeInterest
      summary: Remove an interest from my profile.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /v1/optin:
    post:
      tags: [me]
      operationId: optIn
      summary: Join a pool. Required before setup, connectors, plans and nudges. Idempotent. Switching pools keeps people met and threads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/Mode" }
                poolId: { type: string, description: "Required when the mode has several pools. Take it from /v1/config." }
      responses:
        "200":
          description: Opted in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      operationId: optOut
      summary: Leave the pool. Withdraws open joins, removes the user from matching and the internal map, deletes signals.
      responses:
        "204": { description: Left the pool }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/setup:
    get:
      tags: [me]
      operationId: getSetup
      summary: What Muse picked up from Facebook activity and connected apps, for the setup review. Recomputed after each connect.
      responses:
        "200":
          description: Setup review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
              example:
                museText: "Hi Maya, I'm Muse. From your posts and Google Maps, here's what I think you're into. Hide anything you'd rather keep to yourself."
                proposedInterests:
                  - { interest: { id: outdoors.hiking.coastal_hikes, label: Coastal hikes, path: [Outdoors, Hiking, Coastal hikes], level: 3 }, weight: 0.82, visibility: shown, sensitive: false, source: connector, evidence: "4 visits to Lands End Trail in October (Google Maps)" }
                  - { interest: { id: arts_crafts.ceramics.wheel_throwing, label: Wheel throwing, path: [Arts & crafts, Ceramics, Wheel throwing], level: 3 }, weight: 0.7, visibility: shown, sensitive: false, source: activity, evidence: "Member of SF Clay Collective" }
                  - { interest: { id: identity_values.faith.buddhism, label: Buddhism, path: [Identity & values, Faith, Buddhism], level: 3 }, weight: 0.6, visibility: hidden, sensitive: true, source: connector, evidence: "Weekly visits to a meditation center (Google Maps)" }
                signals:
                  - { signalId: si_0001, provider: google_maps, kind: frequent_place, label: "4 visits to Lands End Trail in October", interests: [{ id: outdoors.hiking, label: Hiking, path: [Outdoors, Hiking], level: 2 }], venue: { venueId: vn_lands_end, name: Lands End Trail, neighborhood: Outer Richmond, location: { lat: 37.7798, lng: -122.5118 }, kind: park }, observedAt: "2026-10-31T19:00:00Z", visibility: shown, sensitive: false }
                  - { signalId: si_0002, provider: google_maps, kind: frequent_place, label: "Weekly visits to a meditation center", interests: [], venue: null, observedAt: "2026-11-08T17:00:00Z", visibility: hidden, sensitive: true }
                proposedGroupSize: { min: 3, max: 5 }
                proposedTravel: { maxMinutes: 35, modes: [transit, walk] }
                suggestedProviders: [device_calendar, google_maps, eventbrite]
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [me]
      operationId: completeSetup
      summary: Confirm reviewed interests and preferences. Builds the first For you carousel immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupComplete" }
      responses:
        "200":
          description: Final profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /v1/connectors:
    get:
      tags: [connectors]
      operationId: listConnectors
      summary: Every connector with what Muse reads from it and whether it is connected.
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Connector" } }
              example:
                items:
                  - { provider: device_calendar, label: "Calendar on this iPhone", reads: "When you're busy. Never what your events are.", status: connected, simulated: false, connectedAt: "2026-11-12T18:00:00Z", lastSyncAt: "2026-11-12T18:00:05Z", signalCount: 0 }
                  - { provider: google_maps, label: "Google Maps", reads: "Places you visit often and places you saved.", status: connected, simulated: true, connectedAt: "2026-11-12T18:00:10Z", lastSyncAt: "2026-11-12T18:00:11Z", signalCount: 2 }
                  - { provider: google_calendar, label: "Google Calendar", reads: "When you're busy. Never what your events are.", status: not_connected, simulated: true, connectedAt: null, lastSyncAt: null, signalCount: 0 }
                  - { provider: strava, label: "Strava", reads: "Your regular runs and rides: activity, area, day and time.", status: not_connected, simulated: true, connectedAt: null, lastSyncAt: null, signalCount: 0 }
                  - { provider: eventbrite, label: "Eventbrite", reads: "Tickets you hold.", status: not_connected, simulated: true, connectedAt: null, lastSyncAt: null, signalCount: 0 }
                  - { provider: luma, label: "Luma", reads: "Events you RSVP'd to.", status: not_connected, simulated: true, connectedAt: null, lastSyncAt: null, signalCount: 0 }
                  - { provider: beli, label: "Beli", reads: "Restaurants you rated and want to try.", status: not_connected, simulated: true, connectedAt: null, lastSyncAt: null, signalCount: 0 }
        default: { $ref: "#/components/responses/Error" }

  /v1/connectors/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [connectors]
      operationId: connectConnector
      summary: |
        Connect a provider. Simulated providers activate the user's seeded records (no real OAuth in v2).
        `device_calendar` means the app has calendar permission; busy blocks then arrive through `syncCalendar`.
        Extraction re-runs; expect `signals.updated` and `me.updated`.
      responses:
        "200":
          description: Connector after connecting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [connectors]
      operationId: disconnectConnector
      summary: Disconnect and delete every signal, busy block and interest evidence derived from this provider.
      responses:
        "204": { description: Disconnected }
        default: { $ref: "#/components/responses/Error" }

  /v1/signals:
    get:
      tags: [connectors]
      operationId: listSignals
      summary: What Muse noticed from my connected apps and Facebook activity. Owner-only.
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Signal" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/signals/{signalId}:
    parameters:
      - name: signalId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [connectors]
      operationId: setSignalVisibility
      summary: Show or hide a signal. Hidden signals are never used for plans, nudges or "Because" lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "200":
          description: Updated signal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [connectors]
      operationId: deleteSignal
      summary: Delete a signal and stop using it.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/calendar/sync:
    post:
      tags: [connectors]
      operationId: syncCalendar
      summary: |
        Upload device calendar busy blocks (start and end only) and report which calendar directives the app applied.
        Send at most once per config.limits.calendarSyncMinIntervalS while foreground, and right after applying directives.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarSync" }
      responses:
        "200":
          description: Sync result, including the directives the app should apply now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarSyncResult" }
              example:
                acceptedBusy: 6
                directives:
                  - { key: mt_0001, desired: event, title: "Wheel-throwing drop-in at Hayes Clay Studio", startsAt: "2026-11-14T18:00:00Z", endsAt: "2026-11-14T20:00:00Z", location: "Hayes Clay Studio, Hayes St, San Francisco", notes: "Planned with Muse in Common Ground. Directions: https://maps.apple.com/?daddr=37.7765,-122.4241&dirflg=r" }
                  - { key: jn_0002, desired: hold, title: "Hold: Strategy game night at Long Table Games", startsAt: "2026-11-19T03:00:00Z", endsAt: "2026-11-19T05:30:00Z", location: "Long Table Games, Mission, San Francisco", notes: "Muse is gathering people. This hold disappears if the plan doesn't fill." }
        default: { $ref: "#/components/responses/Error" }

  /v1/muse/ask:
    post:
      tags: [muse]
      operationId: askMuse
      summary: |
        The Muse bar. Free text ("climb this weekend", a pasted Google Maps link). Muse answers briefly and returns
        matching plans, creating one if nothing fits. Takes 2 to 15 s. Pass `conversationId` to keep context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, description: "Max length from config.limits.museAskMaxChars" }
                conversationId: { type: [string, "null"] }
      responses:
        "200":
          description: Muse's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MuseReply" }
              example:
                conversationId: mc_0001
                reply: { messageId: mm_0002, text: "I found two ceramics plans that fit your weekend. Saturday's wheel-throwing drop-in already has 3 people in.", createdAt: "2026-11-12T18:10:03Z" }
                plans:
                  - planId: pl_0001
                    title: Wheel-throwing drop-in
                    activityType: ceramics_studio
                    venue: { venueId: vn_hayes_clay, name: Hayes Clay Studio, neighborhood: Hayes Valley, address: "Hayes St, San Francisco", location: { lat: 37.7765, lng: -122.4241 }, kind: studio, photoUrl: http://localhost:8000/static/venues/vn_hayes_clay.jpg }
                    startsAt: "2026-11-14T18:00:00Z"
                    endsAt: "2026-11-14T20:00:00Z"
                    durationMin: 120
                    cost: { kind: prepaid, perPersonCents: 3500, currency: USD, label: "$35 per person" }
                    size: { min: 3, max: 5 }
                    crowd: { interestedCount: 3, spotsLeft: 2, sharedWithYou: [{ interest: { id: arts_crafts.ceramics, label: Ceramics, path: [Arts & crafts, Ceramics], level: 2 }, count: 2 }] }
                    travel: { mode: transit, minutes: 22, label: "22 min by transit" }
                    checks:
                      - { kind: calendar, ok: true, label: "Fits your Saturday" }
                      - { kind: travel, ok: true, label: "22 min by transit" }
                      - { kind: spots, ok: true, label: "2 spots left" }
                      - { kind: cost, ok: true, label: "$35 · Muse can book it" }
                    reason: "Three people who love ceramics, on your free Saturday morning."
                    because: [{ source: facebook, label: "You're in SF Clay Collective", signalId: null }]
                    origin: muse
                    status: open
                    myJoin: null
                createdPlanId: null
                prompts: ["Something Sunday afternoon", "Board games this week", "A coastal walk"]
        default: { $ref: "#/components/responses/Error" }

  /v1/feed:
    get:
      tags: [plans]
      operationId: getFeed
      summary: The For you carousel, Muse's live status line and prompt chips. Refetch at config.limits.feedRefreshS.
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
              example:
                generatedAt: "2026-11-12T18:02:00Z"
                nextRefreshAt: "2026-11-13T18:02:00Z"
                museStatus: "Muse is setting up 1 plan for you"
                prompts: ["Climb this weekend", "Pottery", "A coastal walk", "Board games"]
                plans:
                  - planId: pl_0003
                    title: Saturday morning coastal walk
                    activityType: walk
                    venue: { venueId: vn_lands_end, name: Lands End Trail, neighborhood: Outer Richmond, address: "680 Point Lobos Ave, San Francisco", location: { lat: 37.7798, lng: -122.5118 }, kind: park, photoUrl: http://localhost:8000/static/venues/vn_lands_end.jpg }
                    startsAt: "2026-11-14T16:30:00Z"
                    endsAt: "2026-11-14T18:30:00Z"
                    durationMin: 120
                    cost: { kind: free, perPersonCents: 0, currency: USD, label: "Free" }
                    size: { min: 3, max: 6 }
                    crowd: { interestedCount: 5, spotsLeft: 1, sharedWithYou: [{ interest: { id: outdoors.hiking, label: Hiking, path: [Outdoors, Hiking], level: 2 }, count: 4 }] }
                    travel: { mode: transit, minutes: 24, label: "24 min by transit" }
                    checks:
                      - { kind: calendar, ok: true, label: "Fits your Saturday" }
                      - { kind: travel, ok: true, label: "24 min by transit" }
                      - { kind: spots, ok: true, label: "1 spot left" }
                    reason: "Your favorite trail, with four people who also hike the coast."
                    because: [{ source: google_maps, label: "You've walked Lands End 4 times this month", signalId: si_0001 }]
                    origin: nudge
                    status: open
                    myJoin: null
                  - planId: pl_0002
                    title: Strategy game night
                    activityType: board_game_night
                    venue: { venueId: vn_long_table, name: Long Table Games, neighborhood: Mission, address: "Valencia St, San Francisco", location: { lat: 37.7599, lng: -122.4211 }, kind: game_cafe, photoUrl: null }
                    startsAt: "2026-11-19T03:00:00Z"
                    endsAt: "2026-11-19T05:30:00Z"
                    durationMin: 150
                    cost: { kind: pay_at_venue, perPersonCents: 800, currency: USD, label: "$8 table fee, pay there" }
                    size: { min: 4, max: 6 }
                    crowd: { interestedCount: 3, spotsLeft: 3, sharedWithYou: [{ interest: { id: games.board_games, label: Board games, path: [Games, Board games], level: 2 }, count: 3 }] }
                    travel: { mode: transit, minutes: 31, label: "31 min by transit" }
                    checks:
                      - { kind: calendar, ok: true, label: "Fits your Wednesday" }
                      - { kind: travel, ok: true, label: "31 min by transit" }
                    reason: "Long strategy games with three people who play every week."
                    because: []
                    origin: muse
                    status: open
                    myJoin: { joinId: jn_0002, status: interested }
        default: { $ref: "#/components/responses/Error" }

  /v1/plans:
    post:
      tags: [plans]
      operationId: createPlan
      summary: |
        Propose a plan in my own words ("anyone want to try the new ramen place Friday?"), or invite people I've met
        ("Plan something again"). Muse turns it into a plan; Laya then Muse screen it. Needs features.userPlans and
        Me.capabilities.canCreatePlans. A screened-out plan returns 422 `screened` with a safe message. The creator is joined automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, description: "Max length from config.limits.museAskMaxChars" }
                inviteUserIds:
                  type: array
                  description: Only people I've met (Connection status `met`). With invitees the plan is private to them and may be one-to-one.
                  items: { type: string }
      responses:
        "200":
          description: The created plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [plans]
      operationId: getPlan
      summary: The expanded plan pop-up.
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDetail" }
              example:
                planId: pl_0001
                title: Wheel-throwing drop-in
                activityType: ceramics_studio
                venue: { venueId: vn_hayes_clay, name: Hayes Clay Studio, neighborhood: Hayes Valley, address: "Hayes St, San Francisco", location: { lat: 37.7765, lng: -122.4241 }, kind: studio, photoUrl: http://localhost:8000/static/venues/vn_hayes_clay.jpg }
                startsAt: "2026-11-14T18:00:00Z"
                endsAt: "2026-11-14T20:00:00Z"
                durationMin: 120
                cost: { kind: prepaid, perPersonCents: 3500, currency: USD, label: "$35 per person" }
                size: { min: 3, max: 5 }
                crowd: { interestedCount: 3, spotsLeft: 2, sharedWithYou: [{ interest: { id: arts_crafts.ceramics, label: Ceramics, path: [Arts & crafts, Ceramics], level: 2 }, count: 2 }] }
                travel: { mode: transit, minutes: 22, label: "22 min by transit" }
                checks:
                  - { kind: calendar, ok: true, label: "Fits your Saturday" }
                  - { kind: travel, ok: true, label: "22 min by transit" }
                  - { kind: spots, ok: true, label: "2 spots left" }
                  - { kind: cost, ok: true, label: "$35 · Muse can book it" }
                reason: "Three people who love ceramics, on your free Saturday morning."
                because: [{ source: facebook, label: "You're in SF Clay Collective", signalId: null }]
                origin: muse
                status: open
                myJoin: null
                description: "A two-hour open wheel session for beginners and regulars. Clay, tools and firing included."
                museWillHandle: ["Book wheels for the group", "Ask you before paying $35", "Add it to your calendar", "Open a group chat with an intro", "Remind you when to leave"]
                safety: ["Public studio", "Groups of 3 or more", "Share your plan with a friend in one tap"]
                formsAt: "2026-11-13T18:00:00Z"
                alternatives:
                  - { planId: pl_0004, title: Wheel-throwing drop-in, startsAt: "2026-11-15T22:00:00Z" }
                directions: { apple: "https://maps.apple.com/?daddr=37.7765,-122.4241&dirflg=r", google: "https://www.google.com/maps/dir/?api=1&destination=37.7765,-122.4241&travelmode=transit" }
        default: { $ref: "#/components/responses/Error" }

  /v1/public/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [plans]
      operationId: getPublicPlan
      security: []
