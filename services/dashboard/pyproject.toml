[project]
name = "cg-dashboard"
version = "0.1.0"
description = "Common Ground internal dashboard (loopback only)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cg-dashboard = "cg_dashboard.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_dashboard"]
