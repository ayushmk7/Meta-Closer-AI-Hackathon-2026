[project]
name = "cg-api"
version = "0.1.0"
description = "Common Ground backend: public and internal APIs, Muse, Laya (PRD-2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "httpx>=0.27",
    "openai>=1.60",
    # cg_matching's own deps, pinned here too so the lock does not move when the path dep lands.
    "numpy>=2.0",
    "pyarrow>=17",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
# ponytail: optional until slice B's packages/matching lands on this branch's base; then move to dependencies.
matching = ["cg-matching"]

[project.scripts]
cg-api = "cg_api.cli:main"
cg-api-load-seed = "cg_api.cli:load_seed"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
cg-matching = { path = "../../packages/matching", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
