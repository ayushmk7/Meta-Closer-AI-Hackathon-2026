[project]
name = "cg-sim"
version = "0.1.0"
description = "Common Ground seed data, Laya precompute and Monte Carlo simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
cg-sim = "cg_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
