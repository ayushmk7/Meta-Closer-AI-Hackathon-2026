<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Common Ground demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#050505}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#F0F2F5}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.abs{position:absolute;left:0;top:0}
.person{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}

/* captions */
#cap{position:absolute;left:64px;top:56px;z-index:80;max-width:1180px}
.capc{position:absolute;left:0;top:0;width:max-content;max-width:1180px;background:#fff;border-radius:22px;padding:22px 30px 24px;box-shadow:0 10px 30px rgba(20,30,60,.16)}
.capc .tag{display:inline-block;font-size:19px;font-weight:700;color:#0866FF;background:#E7F3FF;border-radius:12px;padding:5px 12px;margin-bottom:10px;letter-spacing:.2px}
.capc .tx{font-size:40px;line-height:1.18;font-weight:700;letter-spacing:-.6px}
.capc .tx em{font-style:normal;color:#0866FF}

/* phone */
#phone{position:absolute;left:0;top:0;width:418px;height:872px;transform-origin:0 0;z-index:40}
.phone-body{position:absolute;inset:0;border-radius:66px;background:#1c1d21;box-shadow:0 40px 90px rgba(10,20,50,.35),inset 0 0 0 3px #45464c}
.screen{position:absolute;left:14px;top:14px;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#F0F2F5}
.island{position:absolute;left:134px;top:11px;width:122px;height:35px;background:#000;border-radius:20px;z-index:90}
.sb{position:absolute;top:0;left:0;right:0;height:52px;z-index:85;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0 44px;font-weight:600;font-size:16px}
.sb .ic{display:flex;gap:6px;align-items:center}
.scr{position:absolute;left:0;top:0;width:390px;height:844px;background:#F0F2F5;overflow:hidden;padding-top:54px}
.ripple{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(24,119,242,.22);border:3px solid rgba(24,119,242,.55);z-index:95;opacity:0}
.finger{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.25);box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:96;opacity:0}

/* app ui */
.hdr{display:flex;align-items:center;gap:10px;padding:4px 16px 12px;background:#fff;border-bottom:1px solid #E4E6EB}
.hdr .t{font-size:27px;font-weight:800;letter-spacing:-.5px;flex:1}
.hdr .st{font-size:18px;font-weight:700;flex:1}
.card{background:#fff;border-radius:12px;margin:8px 10px;padding:13px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.h{font-size:17px;font-weight:700;margin-bottom:8px}
.muted{color:#65676B;font-size:14px;line-height:1.3}
.ava{border-radius:50%;background:#1877F2;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:17px;background:#F0F2F5;font-size:14px;font-weight:600;white-space:nowrap}
.btn{height:46px;border-radius:8px;background:#1877F2;color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn2{background:#E4E6EB;color:#050505}
.bubble{background:#F0F2F5;border-radius:18px;padding:10px 13px;font-size:15.5px;line-height:1.36}
.tog{width:51px;height:31px;border-radius:16px;background:#D8DADF;position:relative;flex:none}
.tog i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.row{display:flex;align-items:center;gap:11px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#050505}
.chk b{color:#31A24C;font-size:15px}
.sec{font-size:17px;font-weight:700;padding:12px 16px 4px}
.lbl{font-size:13px;font-weight:700;color:#65676B;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
.li{display:flex;gap:10px;align-items:center;font-size:15px;padding:5px 0}
.li .d{width:26px;height:26px;border-radius:50%;background:#E7F3FF;display:flex;align-items:center;justify-content:center;flex:none}
.step{display:flex;gap:11px;align-items:flex-start;padding:7px 0}
.step .ic{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .lb{font-size:15px;font-weight:600;line-height:1.3}
.step .dt{font-size:13px;color:#65676B;margin-top:1px}
.msg{display:flex;gap:8px;align-items:flex-end;margin:6px 10px}
.msg .b{max-width:270px;border-radius:18px;padding:9px 13px;font-size:15.5px;line-height:1.33;background:#F0F2F5}
.msg.own{justify-content:flex-end}
.msg.own .b{background:#1877F2;color:#fff}
.who{font-size:12px;color:#65676B;margin:8px 0 0 52px}

/* world bits */
.orb{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:30}
.bub{position:absolute;background:#fff;border-radius:22px;padding:14px 20px;font-size:30px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.15);white-space:nowrap;transform-origin:20% 100%}
.bub:after{content:"";position:absolute;left:34px;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.thought{position:absolute;width:170px;height:170px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.stamp{position:absolute;left:50%;top:128px;transform-origin:50% 50%;font-size:26px;font-weight:800;letter-spacing:1px;padding:3px 12px;border-radius:8px;white-space:nowrap}
.stamp.a{color:#E41E3F;border:3px solid #E41E3F;background:#fff}
.stamp.w{color:#0866FF;border:3px solid #0866FF;background:#fff}
.toast{position:absolute;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;gap:12px;align-items:center;font-size:22px;font-weight:600}
.panel{position:absolute;width:560px;height:600px;border-radius:32px;overflow:hidden;box-shadow:0 14px 40px rgba(20,30,60,.16);background:#fff}
.plabel{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 26px}
.plabel b{font-size:27px}
.plabel span{font-size:20px;color:#65676B;margin-top:2px}
#wipe{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0866FF;z-index:200;display:flex;align-items:center;justify-content:center;color:#fff;font-size:64px;font-weight:800;letter-spacing:-1px}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="room"></div>
  <div class="layer" id="s5" style="background:#F0F2F5"></div>
  <div class="layer" id="street"></div>
  <div class="layer" id="studio"></div>
  <div class="layer" id="outro"></div>
  <div id="phone">
    <div class="phone-body"></div>
    <div class="screen" id="screen"></div>
    <div class="island"></div>
  </div>
  <div id="cap"></div>
  <div id="wipe"><span id="wipetx"></span></div>
  <div class="layer" id="fade" style="background:#000;z-index:300;pointer-events:none"></div>
</div>
<script>
// ---------- time helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const E={
  out:p=>1-Math.pow(1-p,3),
  inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  back:p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  lin:p=>p,
  in:p=>p*p*p,
};
const P=(t,a,d,e=E.out)=>e(clamp((t-a)/d));
// in at a, out at b (each over d), returns 0..1
const win=(t,a,b,d=.35)=>Math.min(P(t,a,d),1-P(t,b-d,d,E.in));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function tf(el,x=0,y=0,s=1,r=0){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`}
function op(el,o){el.style.opacity=o;el.style.visibility=o<=0.001?'hidden':'visible'}
function show(el,on){if(el.dataset.disp===undefined)el.dataset.disp=el.style.display==='none'?'':el.style.display;el.style.display=on?el.dataset.disp:'none'}
// beat grid: 120.19 BPM, first beat 3.0186 s
const BEAT=60/120.19, B0=3.0186, bar=n=>B0+n*4*BEAT;

// ---------- sound cues (read by mix.py) ----------
const SFX=[];
const cue=(t,f,g)=>SFX.push({t:+t.toFixed(3),f,g});
const S={tap:['interface/click_003.ogg',.7],tap2:['ui/click2.ogg',.45],slide:['casino/card-slide-1.ogg',.32],
  soft:['impact/impactSoft_medium_001.ogg',.55],stamp:['impact/impactSoft_medium_004.ogg',.6],bell:['impact/impactBell_heavy_000.ogg',.22],
  tog:['interface/switch_002.ogg',.35],note:['interface/bong_001.ogg',.7],pop:['interface/drop_002.ogg',.3],tick:['interface/click_005.ogg',.45],
  whoosh:['impact/impactSoft_heavy_003.ogg',.28]};
const sfx=(t,k)=>cue(t,S[k][0],S[k][1]);
const keys=(t0,n,dt)=>{for(let i=0;i<n;i++)cue(t0+i*dt,`keyboard/keypress-${String(1+(i*7)%32).padStart(3,'0')}.wav`,.16)};
const steps=(t0,n,dt,which=[0,1,2,3,4])=>{for(let i=0;i<n;i++)cue(t0+i*dt,`impact/footstep_concrete_00${which[i%which.length]}.ogg`,.2)};

// ---------- scene times ----------
const T={s1:0,s2:bar(4),s3:bar(11),s4:bar(19),s5:bar(26),s6:bar(32),s7:bar(44),s8:bar(52),s8b:bar(55.5),s9:bar(59),s9b:bar(63.5),s10:bar(68),end:150};

// ---------- icons ----------
const spk=(sz,c='#fff')=>`<svg width="${sz}" height="${sz}" viewBox="-20 -20 40 40"><path d="M0 -16 Q2.6 -2.6 16 0 Q2.6 2.6 0 16 Q-2.6 2.6 -16 0 Q-2.6 -2.6 0 -16Z" fill="${c}"/><path d="M11 -15 Q11.8 -11.8 15 -11 Q11.8 -10.2 11 -7 Q10.2 -10.2 7 -11 Q10.2 -11.8 11 -15Z" fill="${c}"/></svg>`;
const museAva=(sz)=>`<div class="ava" style="width:${sz}px;height:${sz}px">${spk(sz*.56)}</div>`;
const ic={
  cal:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  pin:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4"><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  chat:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  card:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>`,
  bell:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`,
  ticket:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/></svg>`,
  lock:(c='#65676B')=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
  eye:(c='#65676B')=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  shield:(c='#1877F2')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>`,
  send:(c='#1877F2')=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="${c}"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>`,
  back:(c='#050505')=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  fb:()=>`<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0866FF"/><path d="M13.3 19v-6h2l.3-2.4h-2.3V9.2c0-.7.2-1.2 1.2-1.2h1.2V5.9c-.2 0-1-.1-1.8-.1-1.8 0-3 1.1-3 3.1v1.7H9V13h1.9v6z" fill="#fff"/></svg>`,
  maps:()=>`<svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="#fff" stroke="#E4E6EB"/><path d="M15 6a6 6 0 0 0-6 6c0 4.5 6 11 6 11s6-6.5 6-11a6 6 0 0 0-6-6z" fill="#EA4335"/><circle cx="15" cy="12" r="2.3" fill="#fff"/></svg>`,
  calApp:()=>`<svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="#fff" stroke="#E4E6EB"/><text x="15" y="10" text-anchor="middle" font-size="6.5" font-weight="700" fill="#E41E3F" font-family="system-ui">SAT</text><text x="15" y="24" text-anchor="middle" font-size="13" font-weight="400" fill="#050505" font-family="system-ui">14</text></svg>`,
  strava:()=>`<svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="#FC5200"/><path d="M13 7l-5 10h3l2-4 2 4h3z" fill="#fff"/><path d="M17 17l-1.5 3-1.5-3h-2l3.5 7 3.5-7z" fill="#ffd2bd"/></svg>`,
  star:(c)=>`<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${c}"/></svg>`,
};
const okIc=`<div class="ic" style="background:#31A24C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>`;

// ---------- characters ----------
const CAST={
  maya:{skin:'#F2C9A8',skin2:'#E3AE8B',hair:'#1E1A22',style:'bob',shirt:'#2A9D8F',shirt2:'#23867A',pants:'#3B4A63',shoe:'#F4F1EA',cheek:'#F08A7E'},
  daniel:{skin:'#8A5A3C',skin2:'#74482E',hair:'#1B1410',style:'short',shirt:'#E9A23B',shirt2:'#D08A26',pants:'#2F3A56',shoe:'#2B2B2B',cheek:'#B5644E'},
  rosa:{skin:'#D9A47E',skin2:'#C48D66',hair:'#5A3424',style:'curly',shirt:'#E76F51',shirt2:'#CF5B3F',pants:'#264653',shoe:'#F4F1EA',cheek:'#E07A6A'},
};
function hairBack(o){
  if(o.style==='bob')return `<path d="M86 142 Q82 66 150 62 Q218 66 214 142 L216 206 Q150 220 84 206 Z" fill="${o.hair}"/>`;
  if(o.style==='curly'){let s='';for(let i=0;i<16;i++){const a=Math.PI*(0.95+i*1.1/15)*1;const ang=-Math.PI*0.05+i*(Math.PI*1.1)/15;const x=150+Math.cos(Math.PI+ang)*66,y=134+Math.sin(Math.PI+ang)*62;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="27" fill="${o.hair}"/>`}
    s+=`<circle cx="92" cy="190" r="24" fill="${o.hair}"/><circle cx="208" cy="190" r="24" fill="${o.hair}"/><circle cx="96" cy="214" r="18" fill="${o.hair}"/><circle cx="204" cy="214" r="18" fill="${o.hair}"/>`;return s}
  return '';
}
function hairFront(o){
  if(o.style==='bob')return `<path d="M89 136 Q90 72 150 70 Q210 72 211 136 Q196 106 166 100 Q156 118 124 114 Q102 118 89 136Z" fill="${o.hair}"/>`;
  if(o.style==='short')return `<path d="M91 128 Q88 70 150 70 Q212 70 209 128 Q204 100 186 96 Q150 88 114 96 Q96 100 91 128Z" fill="${o.hair}"/>`;
  if(o.style==='curly'){let s='';[[104,102],[126,86],[150,80],[174,86],[196,102],[114,110],[186,110]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="20" fill="${o.hair}"/>`);return s}
  return '';
}
function headSVG(o){
  return `${hairBack(o)}
  <rect x="136" y="180" width="28" height="48" rx="10" fill="${o.skin2}"/>
  <circle cx="90" cy="148" r="11" fill="${o.skin}"/><circle cx="210" cy="148" r="11" fill="${o.skin}"/>
  <circle cx="150" cy="140" r="60" fill="${o.skin}"/>
  <ellipse class="glow" cx="150" cy="150" rx="56" ry="52" fill="#BFE3FF" opacity="0"/>
  <circle cx="117" cy="166" r="10" fill="${o.cheek}" opacity=".4"/><circle cx="183" cy="166" r="10" fill="${o.cheek}" opacity=".4"/>
  <path class="browL" d="M116 124 Q127 118 138 123" stroke="${o.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="browR" d="M162 123 Q173 118 184 124" stroke="${o.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g class="eyes"><ellipse class="eyeL" cx="128" cy="146" rx="6.5" ry="8.5" fill="#2A1F1F"/><ellipse class="eyeR" cx="172" cy="146" rx="6.5" ry="8.5" fill="#2A1F1F"/>
  <circle class="hl" cx="130.5" cy="143" r="2.2" fill="#fff"/><circle class="hl" cx="174.5" cy="143" r="2.2" fill="#fff"/></g>
  <path d="M150 151 Q145 162 152 164" stroke="${o.skin2}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path class="mouth" d="M136 174 Q150 186 164 174" stroke="#5B2A2A" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  ${hairFront(o)}`;
}
function personSVG(key){
  const o=CAST[key];
  const leg=(side,hx)=>`<g class="leg${side}"><rect class="thigh${side}" x="${hx-15}" y="352" width="30" height="112" rx="15" fill="${o.pants}"/>
     <g class="knee${side}"><rect x="${hx-14}" y="450" width="28" height="114" rx="13" fill="${o.pants}"/><ellipse cx="${hx+(side==='L'?-4:4)}" cy="568" rx="25" ry="13" fill="${o.shoe}"/></g></g>`;
  const arm=(side,sx)=>`<g class="arm${side}"><rect x="${sx-14}" y="222" width="28" height="96" rx="14" fill="${o.shirt}"/>
     <g class="elbow${side}"><rect x="${sx-12.5}" y="304" width="25" height="84" rx="12.5" fill="${o.shirt2}"/><circle cx="${sx}" cy="392" r="14.5" fill="${o.skin}"/>
     ${side==='R'?`<g class="prop"><rect x="${sx-17}" y="352" width="34" height="62" rx="7" fill="#26282E"/><rect x="${sx-17}" y="352" width="34" height="62" rx="7" fill="none" stroke="#4A4D55" stroke-width="2"/><circle cx="${sx-7}" cy="362" r="4" fill="#4A4D55"/><circle cx="${sx}" cy="396" r="13" fill="${o.skin}"/></g>`:''}</g></g>`;
  return `<svg class="person" data-k="${key}" viewBox="0 0 300 600" width="300" height="600" style="overflow:visible">
   <ellipse class="shadow" cx="150" cy="582" rx="78" ry="12" fill="#000" opacity=".12"/>
   <g class="body">
    ${leg('L',131)}${leg('R',169)}
    <path d="M98 226 Q150 206 202 226 L210 362 Q150 380 90 362 Z" fill="${o.shirt}"/>
    <path d="M128 214 Q150 232 172 214" stroke="${o.shirt2}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g class="lap"><ellipse cx="150" cy="404" rx="62" ry="12" fill="#000" opacity=".12"/><path d="M96 352 Q150 340 204 352 L206 384 Q206 404 186 404 L114 404 Q94 404 94 384 Z" fill="${o.pants}"/><circle cx="124" cy="392" r="21" fill="${o.pants}"/><circle cx="176" cy="392" r="21" fill="${o.pants}"/><path d="M150 356 L150 396" stroke="#000" stroke-opacity=".15" stroke-width="3"/></g>
    <g class="head">${headSVG(o)}</g>
    ${arm('L',104)}${arm('R',196)}
   </g></svg>`;
}
function avatarSVG(key,sz){
