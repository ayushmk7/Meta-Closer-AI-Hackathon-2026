[project]
name = "cg-matching"
version = "0.2.0"
description = "Common Ground matching: vectors, scenes, plan proposals, ranking, group formation, travel (CONTRACTS §10)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
